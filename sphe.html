<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>La Raza · Invite list</title>
<link rel="icon" href="/assets/img/logo/favicon.svg" type="image/svg+xml">
<style>
@font-face { font-family: "Manrope"; src: url("/assets/fonts/manrope-latin-wght-normal.woff2") format("woff2-variations"); font-weight: 200 800; font-display: swap; }
:root { --bg: #F3ECE1; --ink: #1D1712; --muted: #6D6152; --bronze: #87673A; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #13100D; --ink: #F3ECE1; --muted: #B3A792; --bronze: #D6B27A; color-scheme: dark; } }
body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
  font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif; text-align: center;
  padding: 40px max(20px, env(safe-area-inset-right)) 40px max(20px, env(safe-area-inset-left)); }
main { max-width: 380px; display: flex; flex-direction: column; align-items: center; gap: 14px; }
img { width: 52px; }
h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.01em; text-wrap: balance; }
p { margin: 0; color: var(--muted); line-height: 1.55; }
small { font-size: 11px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--bronze); }
</style>
</head>
<body>
<main>
  <img src="/assets/img/logo/emblem-gold.svg" alt="">
  <small>La Raza · Soft launch</small>
  <h1>Sphe D’s guests are now on the main invite list</h1>
  <p>Every invitation goes out from one list, so nobody gets it twice. Their links still work.</p>
</main>
</body>
</html>
